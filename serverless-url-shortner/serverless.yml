# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: mark1024
service: serverless-url-shortener

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1 # Change if needed
  stage: ${opt:stage, 'dev'}
  environment:
    DYNAMODB_TABLE_SHORTEN_URL: ${env:DYNAMODB_TABLE_SHORTEN_URL}
    DYNAMODB_TABLE_USERS: ${env:DYNAMODB_TABLE_USERS}
    SHORT_BASE_URL: ${env:SHORT_BASE_URL}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:DescribeTable
        - dynamodb:CreateTable
        - dynamodb:UpdateTable
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:UpdateItem
        - dynamodb:Scan
      Resource: 
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_TABLE_SHORTEN_URL}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_TABLE_USERS}"

plugins:
  - serverless-offline
  # - serverless-dynamodb-local
functions:
  shorten:
    handler: src/handlers/shorten.shorten
    events:
      - httpApi:
          method: POST
          path: /shorten
  redirect:
    handler: src/handlers/redirect.redirect
    events:
      - httpApi:
          method: GET
          path: /{shortId}
  signup:
    handler: src/handlers/auth/signup.handler
    events:
      - httpApi:
          method: POST
          path: /auth/signup

resources:
  Resources:
    ShortUrlsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:DYNAMODB_TABLE_SHORTEN_URL}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE_USERS}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S 
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST # or use ProvisionedThroughput for fine-tuned control
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: false # Set to true if you want to auto-expire items


